# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    server_name laines.facisa.ufrn.br 10.3.227.82 _;
    server_tokens off;

    location ~ /\.(?!well-known) { deny all; }

    return 301 https://$host$request_uri;
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name laines.facisa.ufrn.br;
    server_tokens off;

    # TLS — gerenciado pelo Certbot (não editar manualmente)
    ssl_certificate     /etc/letsencrypt/live/laines.facisa.ufrn.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laines.facisa.ufrn.br/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root  /home/admin/projetos/laines-app/dist;
    index index.html;
    client_max_body_size 110m;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml font/woff2;

    # Bloquear arquivos sensíveis
    location ~* (^|/)\.env(\..*)?$  { deny all; }
    location ~* (^|/)\.git(/|$)     { deny all; }
    location ~ /\.(?!well-known)    { deny all; }
    location ~* \.(env(\..*)?|ini|log|bak([-.].*)?|backup|old|orig|save|sql|sqlite|db|pem|key|crt|yml|yaml)$ { deny all; }

    # WebSocket
    location ^~ /api/socket.io/ {
        proxy_pass         http://127.0.0.1:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /api { return 308 /api/; }

    # URL HMAC de desenvolvimento/local: nao registrar o token de upload.
    location ^~ /api/avaliacoes-imagem/uploads/local/ {
        access_log off;
        proxy_pass         http://127.0.0.1:4000/avaliacoes-imagem/uploads/local/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # API — headers de segurança vêm do Helmet (NestJS)
    location ^~ /api/ {
        proxy_pass         http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # SPA — frontend estático
    location / {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff"                             always;
        add_header X-Frame-Options           "SAMEORIGIN"                          always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
        add_header Permissions-Policy        "camera=(self), microphone=(), geolocation=()" always;
        # MINIO_CSP_ORIGIN é substituído pelo envsubst no deploy (ex: https://minio.facisa.ufrn.br:9000).
        # Deixe vazio se o upload for roteado pelo próprio backend (driver=local).
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'sha256-1I5qJZwlpIUOlz+vCYTuuBodlTPSFa6A37Li8THMVZk='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' wss: ws: ${MINIO_CSP_ORIGIN}; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
