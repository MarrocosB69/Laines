server {
    listen 80;
    server_name laines.facisa.ufrn.br 10.3.227.82 _;
    server_tokens off;

    root  /home/admin/projetos/laines-app/dist;
    index index.html;
    client_max_body_size 25m;

    location ~* (^|/)\.env(\..*)?$  { deny all; }
    location ~* (^|/)\.git(/|$)     { deny all; }
    location ~ /\.(?!well-known)    { deny all; }
    location ~* \.(env(\..*)?|ini|log|bak([-.].*)?|backup|old|orig|save|sql|sqlite|db|pem|key|crt|yml|yaml)$ { deny all; }

    location ^~ /api/socket.io/ {
        proxy_pass         http://127.0.0.1:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /api { return 308 /api/; }

    location ^~ /api/ {
        proxy_pass         http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        add_header X-Content-Type-Options    "nosniff"                             always;
        add_header X-Frame-Options           "SAMEORIGIN"                          always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'sha256-1I5qJZwlpIUOlz+vCYTuuBodlTPSFa6A37Li8THMVZk='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' wss: ws:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
