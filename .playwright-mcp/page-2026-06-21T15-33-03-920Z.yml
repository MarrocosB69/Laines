          - figure "FIGURE 1 LASSO regression cross-validation and Bland-Altman analyses for the SS20 evaluations (A, B; n = 36) and the Me360 evaluations (C, D; n = 27) in women. The solid lines in panels A and C are the lines of identity and the regression lines with 95% CI (both, P < 0.001). In panels B and D, the solid horizontal line indicates the mean difference between DXA and predicted ALM, the dashed horizontal lines indicate the 95% limits of agreement (that is, 1.96 times the SD of the difference between DXA and predicted ALM), and the gray shading indicates the 95% CIs for the regression line. ALM, appendicular lean mass; LASSO, Least Absolute Shrinkage and Selection Operator; LOA, limits of agreement; Me360, MeThreeSixty." [ref=e177] [cursor=pointer]:
