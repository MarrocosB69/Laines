      - generic [ref=e151]:
        - heading "Abstract" [level=2] [ref=e152]
        - generic [ref=e153]:
          - paragraph [ref=e154]:
            - strong [ref=e155]: "Background:"
            - text: Skeletal muscle is a large and clinically relevant body component that has been difficult and impractical to quantify outside of specialized facilities. Advances in smartphone technology now provide the opportunity to quantify multiple body surface dimensions such as circumferences, lengths, surface areas, and volumes.
          - paragraph [ref=e156]:
            - strong [ref=e157]: "Objectives:"
            - text: This study aimed to test the hypothesis that anthropometric body measurements acquired with a smartphone application can be used to accurately estimate an adult's level of muscularity.
          - paragraph [ref=e158]:
            - strong [ref=e159]: "Methods:"
            - text: Appendicular lean mass (ALM) measured by DXA served as the reference for muscularity in a sample of 322 adults. Participants also had digital anthropometric dimensions (circumferences, lengths, and regional and total body surface areas and volumes) quantified with a 20-camera 3D imaging system. Least absolute shrinkage and selection operator (LASSO) regression procedures were used to develop the ALM prediction equations in a portion of the sample, and these models were tested in the remainder of the sample. Then, the accuracy of the prediction models was cross-validated in a second independent sample of 53 adults who underwent ALM estimation by DXA and the same digital anthropometric estimates acquired with a smartphone application.
          - paragraph [ref=e160]:
            - strong [ref=e161]: "Results:"
            - text: LASSO models included multiple significant demographic and 3D digital anthropometric predictor variables. Evaluation of the models in the testing sample indicated respective RMSEs in women and men of 1.56 kg and 1.53 kg and R
            - superscript [ref=e162]: "2"
            - text: "'s of 0.74 and 0.90, respectively. Cross-validation of the LASSO models in the smartphone application group yielded RMSEs in women and men of 1.78 kg and 1.50 kg and R"
            - superscript [ref=e163]: "2"
            - text: "'s of 0.79 and 0.95; no significant differences or bias between measured and predicted ALM values were observed."
          - paragraph [ref=e164]:
            - strong [ref=e165]: "Conclusions:"
            - text: Smartphone image capture capabilities combined with device software applications can now provide accurate renditions of the adult muscularity phenotype outside of specialized laboratory facilities. Am J Clin Nutr 2023;x:xx. This trial was registered at clinicaltrials.gov as
            - link "NCT03637855" [ref=e166] [cursor=pointer]:
              - /url: http://clinicaltrials.gov/show/NCT03637855
            - text: (https://clinicaltrials.gov/ct2/show/NCT03637855),
            - link "NCT05217524" [ref=e167] [cursor=pointer]:
              - /url: http://clinicaltrials.gov/show/NCT05217524
            - text: (https://clinicaltrials.gov/ct2/show/NCT05217524), and
            - link "NCT03771417" [ref=e168] [cursor=pointer]:
              - /url: http://clinicaltrials.gov/show/NCT03771417
            - text: (https://clinicaltrials.gov/ct2/show/NCT03771417).
        - paragraph [ref=e169]:
          - strong [ref=e170]: "Keywords:"
          - text: body composition; malnutrition; nutritional assessment; obesity; optical imaging; sarcopenia.
