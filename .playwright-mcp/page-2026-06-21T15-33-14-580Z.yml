      - generic [ref=e204]:
        - heading "Abstract" [level=2] [ref=e205]
        - generic [ref=e206]:
          - paragraph [ref=e207]:
            - strong [ref=e208]: "Background:"
            - text: Three-dimensional optical (3DO) body scanning has been proposed for automatic anthropometry. However, conventional measurements fail to capture detailed body shape. More sophisticated shape features could better indicate health status.
          - paragraph [ref=e209]:
            - strong [ref=e210]: "Objectives:"
            - text: The objectives were to predict DXA total and regional body composition, serum lipid and diabetes markers, and functional strength from 3DO body scans using statistical shape modeling.
          - paragraph [ref=e211]:
            - strong [ref=e212]: "Methods:"
            - text: Healthy adults underwent whole-body 3DO and DXA scans, blood tests, and strength assessments in the Shape Up! Adults cross-sectional observational study. Principal component analysis was performed on registered 3DO scans. Stepwise linear regressions were performed to estimate body composition, serum biomarkers, and strength using 3DO principal components (PCs). 3DO model accuracy was compared with simple anthropometric models and precision was compared with DXA.
          - paragraph [ref=e213]:
            - strong [ref=e214]: "Results:"
            - text: "This analysis included 407 subjects. Eleven PCs for each sex captured 95% of body shape variance. 3DO body composition accuracy to DXA was: fat mass R2 = 0.88 male, 0.93 female; visceral fat mass R2 = 0.67 male, 0.75 female. 3DO body fat test-retest precision was: root mean squared error = 0.81 kg male, 0.66 kg female. 3DO visceral fat was as precise (%CV = 7.4 for males, 6.8 for females) as DXA (%CV = 6.8 for males, 7.4 for females). Multiple 3DO PCs were significantly correlated with serum HDL cholesterol, triglycerides, glucose, insulin, and HOMA-IR, independent of simple anthropometrics. 3DO PCs improved prediction of isometric knee strength (combined model R2 = 0.67 male, 0.59 female; anthropometrics-only model R2 = 0.34 male, 0.24 female)."
          - paragraph [ref=e215]:
            - strong [ref=e216]: "Conclusions:"
            - text: 3DO body shape PCs predict body composition with good accuracy and precision comparable to existing methods. 3DO PCs improve prediction of serum lipid and diabetes markers, and functional strength measurements. The safety and accessibility of 3DO scanning make it appropriate for monitoring individual body composition, and metabolic health and functional strength in epidemiological settings.This trial was registered at clinicaltrials.gov as
            - link "NCT03637855" [ref=e217] [cursor=pointer]:
              - /url: http://clinicaltrials.gov/show/NCT03637855
            - text: .
        - paragraph [ref=e218]:
          - strong [ref=e219]: "Keywords:"
          - text: body composition; diabetes; imaging; obesity; principal component analysis; strength.
      - paragraph [ref=e220]: Copyright © American Society for Nutrition 2019.
