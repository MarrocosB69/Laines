          - code [ref=e395]: getUserMedia()
          - text: .
        - paragraph [ref=e396]:
          - text: Below are some examples of the
          - code [ref=e397]: constraints
          - text: parameter.
        - paragraph [ref=e398]: "The following requests both audio and video without any specific requirements:"
        - generic [ref=e400]:
          - generic [ref=e401]:
            - generic [ref=e402]: js
            - button "Copy" [ref=e405] [cursor=pointer]:
              - generic [ref=e406]:
                - generic: Copy
          - code [ref=e408]: "getUserMedia({ audio: true, video: true, });"
        - paragraph [ref=e409]: "While information about a user's cameras and microphones are inaccessible for privacy reasons, an application can request the camera and microphone capabilities it needs and wants, using additional constraints. The following expresses a preference for 1280x720 camera resolution:"
        - generic [ref=e411]:
          - generic [ref=e412]:
            - generic [ref=e413]: js
            - button "Copy" [ref=e416] [cursor=pointer]:
              - generic [ref=e417]:
                - generic: Copy
          - code [ref=e419]: "getUserMedia({ audio: true, video: { width: 1280, height: 720 }, });"
        - paragraph [ref=e420]:
          - text: The browser will try to honor the constraints, and will return a matching track if supported by the underlying hardware. If not supported, the browser may attempt to crop and downscale a higher resolution stream from the underlying hardware in order to match the constraint (and might also reduce the frame rate if that was constrained). This behavior can be forced by setting the
          - link "resizeMode" [ref=e421] [cursor=pointer]:
            - /url: /en-US/docs/Web/API/MediaTrackConstraints#resizemode
            - code [ref=e422]: resizeMode
          - text: constraint to
          - code [ref=e423]: crop-and-scale
          - text: (or disabled by setting it to
          - code [ref=e424]: none
          - text: "):"
        - generic [ref=e426]:
          - generic [ref=e427]:
            - generic [ref=e428]: js
            - button "Copy" [ref=e431] [cursor=pointer]:
              - generic [ref=e432]:
                - generic: Copy
          - code [ref=e434]: "getUserMedia({ audio: true, video: { width: 1280, height: 720, resizeMode: \"crop-and-scale\" }, });"
        - paragraph [ref=e435]: The browser may return another resolution if an exact match is not available and the source is not to be scaled.
        - paragraph [ref=e436]:
          - text: To
          - emphasis [ref=e437]: require
          - text: a capability and fail if it is not available, use the keywords
          - code [ref=e438]: min
          - text: ","
          - code [ref=e439]: max
          - text: ", or"
          - code [ref=e440]: exact
          - text: (a.k.a.
          - code [ref=e441]: min === max
          - text: "). The following demands a minimum resolution of 1280x720:"
        - generic [ref=e443]:
          - generic [ref=e444]:
            - generic [ref=e445]: js
            - button "Copy" [ref=e448] [cursor=pointer]:
              - generic [ref=e449]:
                - generic: Copy
          - code [ref=e451]: "getUserMedia({ audio: true, video: { width: { min: 1280 }, height: { min: 720 }, }, });"
        - paragraph [ref=e452]:
          - text: If no camera exists with this resolution or higher, then the returned promise will be rejected with
          - code [ref=e453]: OverconstrainedError
          - text: ", and the user will not be prompted."
        - paragraph [ref=e454]:
          - text: The reason for the difference in behavior is that the keywords
          - code [ref=e455]: min
          - text: ","
          - code [ref=e456]: max
          - text: ", and"
          - code [ref=e457]: exact
          - text: are inherently mandatory — whereas plain values and a keyword called
          - code [ref=e458]: ideal
          - text: "are not. Here's a full example:"
        - generic [ref=e460]:
          - generic [ref=e461]:
            - generic [ref=e462]: js
            - button "Copy" [ref=e465] [cursor=pointer]:
              - generic [ref=e466]:
                - generic: Copy
          - code [ref=e468]: "getUserMedia({ audio: true, video: { width: { min: 1024, ideal: 1280, max: 1920 }, height: { min: 576, ideal: 720, max: 1080 }, }, });"
        - paragraph [ref=e469]:
          - text: An
          - code [ref=e470]: ideal
          - text: value, when used, has gravity — which means that the browser will try to find the setting (and camera, if you have more than one), with the smallest
          - link "fitness distance (external)" [ref=e471] [cursor=pointer]:
            - /url: https://w3c.github.io/mediacapture-main/#dfn-fitness-distance
          - text: from the ideal values given.
        - paragraph [ref=e472]: "Plain values are inherently ideal, which means that the first of our resolution examples above could have been written like this:"
        - generic [ref=e474]:
          - generic [ref=e475]:
            - generic [ref=e476]: js
            - button "Copy" [ref=e479] [cursor=pointer]:
              - generic [ref=e480]:
                - generic: Copy
          - code [ref=e482]: "getUserMedia({ audio: true, video: { width: { ideal: 1280 }, height: { ideal: 720 }, }, });"
        - paragraph [ref=e483]: "Not all constraints are numbers. For example, on mobile devices, the following will prefer the front camera (if one is available) over the rear one:"
        - generic [ref=e485]:
          - generic [ref=e486]:
            - generic [ref=e487]: js
            - button "Copy" [ref=e490] [cursor=pointer]:
              - generic [ref=e491]:
                - generic: Copy
          - code [ref=e493]: "getUserMedia({ audio: true, video: { facingMode: \"user\" }, });"
        - paragraph [ref=e494]:
          - text: To
          - emphasis [ref=e495]: require
          - text: "the rear camera, use:"
        - generic [ref=e497]:
          - generic [ref=e498]:
