          - code [ref=e376]: "async function getMedia(constraints) { let stream = null; try { stream = await navigator.mediaDevices.getUserMedia(constraints); /* use the stream */ } catch (err) { /* handle the error */ } }"
        - paragraph [ref=e377]: "Similarly, using the raw promises directly, the code looks like this:"
