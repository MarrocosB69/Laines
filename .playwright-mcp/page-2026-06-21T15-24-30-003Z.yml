        - paragraph [ref=e506]:
          - text: Another non-number constraint is the
          - code [ref=e507]: deviceId
          - text: constraint. If you have a
          - code [ref=e508]: deviceId
          - text: from
          - link "mediaDevices.enumerateDevices()" [ref=e509] [cursor=pointer]:
            - /url: /en-US/docs/Web/API/MediaDevices/enumerateDevices
            - code [ref=e510]: mediaDevices.enumerateDevices()
          - text: ", you can use it to request a specific device:"
        - generic [ref=e512]:
