              - heading "Model" [level=3] [ref=e400]
              - paragraph [ref=e401]:
                - text: The MediaPipe Pose Landmarker task requires a trained model that is compatible with this task. For more information on available trained models for Pose Landmarker, see the task overview
                - link "Models section" [ref=e402] [cursor=pointer]:
