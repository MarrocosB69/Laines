              - paragraph [ref=e374]: The MediaPipe Pose Landmarker task lets you detect landmarks of human bodies in an image or video. You can use this task to identify key body locations, analyze posture, and categorize movements. This task uses machine learning (ML) models that work with single images or video. The task outputs body pose landmarks in image coordinates and in 3-dimensional world coordinates.
              - paragraph [ref=e375]:
                - text: These instructions show you how to use the Pose Landmarker for web and JavaScript apps. For more information about the capabilities, models, and configuration options of this task, see the
                - link "Overview" [ref=e376] [cursor=pointer]:
                  - /url: https://developers.google.com/edge/mediapipe/solutions/vision/pose_landmarker/index
                - text: .
              - 'heading "Code example Copiar o link desta seção: Code example" [level=2] [ref=e377]':
                - heading "Code example" [level=2] [ref=e378]
                - 'button "Copiar o link desta seção: Code example" [ref=e379] [cursor=pointer]': link
              - paragraph [ref=e380]:
                - text: The example code for Pose Landmarker provides a complete implementation of this task in JavaScript for your reference. This code helps you test this task and get started on building your own pose landmarker app. You can view, run, and edit the Pose Landmarker
                - link "example" [ref=e381] [cursor=pointer]:
                  - /url: https://stackblitz.com/https://github.com/google-ai-edge/mediapipe-samples-web/
                - text: using just your web browser.
              - heading "Setup" [level=2] [ref=e382]
              - paragraph [ref=e383]:
                - text: This section describes key steps for setting up your development environment specifically to use Pose Landmarker. For general information on setting up your web and JavaScript development environment, including platform version requirements, see the
                - link "Setup guide for web" [ref=e384] [cursor=pointer]:
                  - /url: /mediapipe/solutions/setup_web
                - text: .
