version: '3.9'

services:
  # NestJS backend
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - '127.0.0.1:4000:4000'
    env_file: ./server/.env
    environment:
      HOST: 0.0.0.0
      PORT: 4000
      UPLOAD_DIR: /app/uploads
      IMAGE_PROCESSOR_URL: http://image-processor:8001
      IMAGE_STORAGE_DRIVER: local
      NESTJS_UPLOAD_BASE: /app/uploads/avaliacoes-imagem
    volumes:
      - uploads:/app/uploads
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      - image-processor
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:4000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Python image/video processor
  image-processor:
    build:
      context: ./laines-image-processor
      dockerfile: Dockerfile
    expose:
      - '8001'
    env_file: ./server/.env
    volumes:
      - uploads:/uploads
    environment:
      # Remap the NestJS absolute path to this container's mount point
      NESTJS_UPLOAD_BASE: /app/uploads/avaliacoes-imagem
      PROCESSOR_UPLOAD_BASE: /uploads/avaliacoes-imagem
      PORT: 8001
      PROCESSOR_JOB_STATE_PATH: /uploads/.image-processor-jobs.json
      PROCESSOR_USE_SMPLX: 'true'
      PROCESSOR_SMPLX_MODEL_DIR: /app/models
      PROCESSOR_SMPLX_DEVICE: cpu
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3); raise SystemExit(0 if r.status == 200 else 1)"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  uploads:
